<app-encabezado></app-encabezado>
<div class="container mt-4">
  <div class="row mb-3">
    <div class="col-12">
      <button class="btn btn-secondary" (click)="volver()">
        <i class="bi bi-arrow-left"></i> Volver
      </button>
    </div>
  </div>

  <div class="row mb-4">
    <div class="col-12">
      <h1>Egresos - {{ nombrePropiedad }}</h1>
    </div>
  </div>

  <!-- Filtros -->
  <div class="row mb-4">
    <div class="col-md-6">
      <label for="mes" class="form-label">Mes</label>
      <select 
        id="mes"
        class="form-select" 
        [(ngModel)]="mesSeleccionado" 
        (change)="cambiarMes()">
        <option *ngFor="let m of meses" [value]="m.id">{{ m.nombre }}</option>
      </select>
    </div>
    <div class="col-md-6">
      <label for="anio" class="form-label">Año</label>
      <select 
        id="anio"
        class="form-select" 
        [(ngModel)]="anioSeleccionado" 
        (change)="cambiarAnio()">
        <option *ngFor="let a of anios" [value]="a.id">{{ a.nombre }}</option>
      </select>
    </div>
  </div>

  <!-- Resumen -->
  <div class="row mb-4">
    <div class="col-md-6">
      <div class="card bg-danger text-white">
        <div class="card-body">
          <h5 class="card-title">Total Egresos</h5>
          <p class="card-text fs-4">${{ total | number: '1.0-0' }}</p>
          <p class="card-text"><small>{{ cantidad }} movimientos</small></p>
        </div>
      </div>
    </div>
  </div>

  <!-- Tabla de Egresos -->
  <div class="row">
    <div class="col-12">
      <div *ngIf="cargando" class="alert alert-info">
        <i class="bi bi-hourglass-split"></i> Cargando egresos...
      </div>

      <div *ngIf="!cargando && egresos.length > 0">
        <table class="table table-hover">
          <thead class="table-light">
            <tr>
              <th>Fecha</th>
              <th>Concepto</th>
              <th>Valor</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let egreso of egresos; trackBy: trackByFn">
              <td>{{ egreso.fecha | date: 'dd/MM/yyyy HH:mm' }}</td>
              <td>{{ egreso.concepto }}</td>
              <td class="text-danger fw-bold">${{ egreso.valor | number: '1.0-0' }}</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div *ngIf="!cargando && egresos.length === 0" class="alert alert-warning text-center">
        <i class="bi bi-info-circle"></i> No hay egresos para el período seleccionado
      </div>
    </div>
  </div>
</div>
