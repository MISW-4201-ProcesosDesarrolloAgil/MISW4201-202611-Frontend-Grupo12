<nav class="sidebar" [class.collapsed]="collapsed" aria-label="Main navigation">
  <div class="brand">
    <button class="toggle" (click)="toggle()" aria-label="Toggle sidebar">☰</button>
    <span class="title">Gestión</span>
  </div>
  <ul class="menu">
    <li routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      <a [routerLink]="['/']" title="Inicio">
        <span class="icon" aria-hidden="true">🏠</span>
        <span class="label">Inicio</span>
      </a>
    </li>
    <li routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      <a [routerLink]="['/registro']" title="Registro">
        <span class="icon" aria-hidden="true">👤</span>
        <span class="label">Registro</span>
      </a>
    </li>
    <li routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      <a [routerLink]="['/propiedades']" title="Propiedades">
        <span class="icon" aria-hidden="true">🏡</span>
        <span class="label">Propiedades</span>
      </a>
    </li>
    <li routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" [class.disabled]="!reservasLink">
      <ng-container *ngIf="reservasLink; else reservasDisabled">
        <a [routerLink]="reservasLink" title="Reservas">
          <span class="icon" aria-hidden="true">📅</span>
          <span class="label">Reservas</span>
        </a>
      </ng-container>
      <ng-template #reservasDisabled>
        <a href="#" (click)="goTo('/propiedades', $event)" title="Selecciona una propiedad para acceder">
          <span class="icon" aria-hidden="true">📅</span>
          <span class="label">Reservas</span>
        </a>
      </ng-template>
    </li>
    <li routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" [class.disabled]="!ingresosLink">
      <ng-container *ngIf="ingresosLink; else ingresosDisabled">
        <a [routerLink]="ingresosLink" title="Ingresos">
          <span class="icon" aria-hidden="true">📈</span>
          <span class="label">Ingresos</span>
        </a>
      </ng-container>
      <ng-template #ingresosDisabled>
        <a href="#" (click)="goTo('/propiedades', $event)" title="Selecciona una propiedad para acceder">
          <span class="icon" aria-hidden="true">📈</span>
          <span class="label">Ingresos</span>
        </a>
      </ng-template>
    </li>
    <li routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" [class.disabled]="!egresosLink">
      <ng-container *ngIf="egresosLink; else egresosDisabled">
        <a [routerLink]="egresosLink" title="Egresos">
          <span class="icon" aria-hidden="true">📉</span>
          <span class="label">Egresos</span>
        </a>
      </ng-container>
      <ng-template #egresosDisabled>
        <a href="#" (click)="goTo('/propiedades', $event)" title="Selecciona una propiedad para acceder">
          <span class="icon" aria-hidden="true">📉</span>
          <span class="label">Egresos</span>
        </a>
      </ng-template>
    </li>
  </ul>
</nav>
